<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="https://glitch.com/favicon.ico" />

    <title>My Webpage</title>

    <!-- I merged the css and js refs -->
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>

  <body style="
    margin: 0;
    padding: 40px 20px;
    font-family: Arial, Helvetica, sans-serif;
    background-color: #3a3a3a;
    color: #ffffff;
    line-height: 1.6;
    text-align: center;
  ">

    <!-- Welcome section -->
    <header id="introduction" style="
      max-width: 700px;
      margin: 0 auto 25px;
      padding: 30px;
      text-align: center;
      background-color: #000000;
      border-radius: 15px;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.3);
    ">
      <h1 style="
        margin: 0 0 8px;
        color: #D4AF37;
        font-size: 2.5rem;
        text-align: center;
      ">
        Welcome to my webpage!
      </h1>
    </header>

    <main style="
      max-width: 700px;
      margin: 0 auto;
      text-align: center;
    ">

      <!-- Quick introduction -->
      <section id="about-me" style="
        background-color: #000000;
        padding: 25px 30px;
        margin-bottom: 20px;
        border-radius: 15px;
        box-shadow: 0 5px 18px rgba(0, 0, 0, 0.3);
        text-align: center;
      ">
        <h2 style="
          margin-top: 0;
          color: #D4AF37;
          border-bottom: 2px solid #D4AF37;
          padding-bottom: 8px;
          text-align: center;
        ">
          My name is Ivan Estrada
        </h2>

        <p style="
          color: #ffffff;
          text-align: center;
        ">
          I'm a Computer Science student with an interest in technology
          and programming.
        </p>
      </section>

      <!-- School section -->
      <section id="school" style="
        background-color: #000000;
        padding: 25px 30px;
        margin-bottom: 20px;
        border-radius: 15px;
        box-shadow: 0 5px 18px rgba(0, 0, 0, 0.3);
        text-align: center;
      ">
        <h2 style="
          margin-top: 0;
          color: #D4AF37;
          border-bottom: 2px solid #D4AF37;
          padding-bottom: 8px;
          text-align: center;
        ">
          School
        </h2>

        <p style="
          margin: 12px 0;
          color: #ffffff;
          text-align: center;
        ">
          I am a student at
          <strong style="color: #1d4ed8;">CSUN</strong>.
        </p>

        <p style="
          margin: 12px 0;
          color: #ffffff;
          text-align: center;
        ">
          My major is
          <strong style="color: #1d4ed8;">Computer Science</strong>.
        </p>

        <p style="
          margin: 12px 0;
          color: #ffffff;
          text-align: center;
        ">
          My expected graduation is
          <strong style="color: #1d4ed8;">Spring 2027</strong>.
        </p>
      </section>

    </main>

  </body>
</html>
